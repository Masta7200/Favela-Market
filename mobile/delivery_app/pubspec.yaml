name: tumai_market_delivery
description: Delivery app for Tumaï Market - Receive and deliver customer orders
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0

  # State Management
  provider: ^6.1.1

  # Navigation
  go_router: ^13.0.0

  # Network
  http: ^1.1.2

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Images
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Calls / SMS / Maps
  url_launcher: ^6.3.0

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  # Generated with: dart run flutter_launcher_icons
  # app_icon.png = full icon (iOS, older Android, Windows)
  # Android 8+: the drawing (foreground) on its own background, shaped by the phone
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "lib/assets/icons/app_icon.png"
  adaptive_icon_background: "lib/assets/icons/app_icon_background.png"
  adaptive_icon_foreground: "lib/assets/icons/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  windows:
    generate: true
    image_path: "lib/assets/icons/app_icon.png"
    icon_size: 48

flutter:
  uses-material-design: true
