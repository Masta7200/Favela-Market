name: tumai_market_client
description: Application client pour Tumaï Market - Marketplace multi-vendeurs
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^15.1.2

  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  # State Management
  provider: ^6.1.1

  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Form & Validation
  flutter_form_builder: ^9.1.1
  form_builder_validators: ^11.0.0

  # UI Components
  flutter_spinkit: ^5.2.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  pull_to_refresh: ^2.0.0

  # Phone Input
  intl_phone_field: ^3.2.0

  # Image Picker
  image_picker: ^1.0.7

  # Maps
  url_launcher: ^6.2.2

  # Utils
  intl: ^0.19.0
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  # Generated with: dart run flutter_launcher_icons
  # app_icon.png = full icon (iOS, older Android, Windows)
  # Android 8+: the drawing (foreground) on its own background, shaped by the phone
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "lib/assets/icons/app_icon.png"
  adaptive_icon_background: "lib/assets/icons/app_icon_background.png"
  adaptive_icon_foreground: "lib/assets/icons/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  windows:
    generate: true
    image_path: "lib/assets/icons/app_icon.png"
    icon_size: 48

flutter:
  uses-material-design: true
  
  # assets:
  #   - assets/images/
  #   - assets/icons/
  #   - assets/animations/
  